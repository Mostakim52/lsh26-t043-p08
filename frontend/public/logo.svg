<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Result office">
  <title>Result office</title>
  <defs>
    <linearGradient id="ro-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c76ff"/>
      <stop offset="1" stop-color="#1d2b82"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect width="32" height="32" rx="8" fill="url(#ro-badge)"/>

  <!-- three ascending grade points -->
  <g fill="#ffffff">
    <rect x="7" y="18.5" width="4" height="7" rx="2" opacity="0.62"/>
    <rect x="13" y="14" width="4" height="11.5" rx="2" opacity="0.82"/>
    <rect x="19" y="9.5" width="4" height="16" rx="2"/>
  </g>

  <!-- verification tick -->
  <path d="M9.6 10.6 L12.4 13.3 L18 7.2" fill="none" stroke="#8fe3c4" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
